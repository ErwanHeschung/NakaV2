services:
  llm:
    # Pinned by digest, not tag: ghcr.io/ggml-org/llama.cpp:server-cuda
    image: ghcr.io/ggml-org/llama.cpp@sha256:131a7be5d90d6df75f32ffad405d71e354e9bdba806264b6a905339283925b85
    # Host-side bind is loopback only — the Windows client reaches it through
    # WSL2 localhost forwarding, so it never needs to be on the LAN.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.models:/models:ro
    command:
      - --model
      # Swap candidates with: MODEL=Qwen3-14B-Q4_K_M.gguf docker compose up -d llm
      - /models/${MODEL:-gemma-4-12b-it-qat-q4_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "999"
      # One inference at a time: concurrent requests on a single card lose more
      # to thrashing than parallelism wins back.
      - --parallel
      - "1"
      - --ctx-size
      - "${CTX_SIZE:-8192}"
      - --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
