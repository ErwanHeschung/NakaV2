[identity]
# Who the assistant is and who it is talking to. Everything else refers to
# these rather than naming anyone, so the app can ship to someone else by
# editing this block and persona.md.
assistant = "Naka"
user = "Erwan"
# Used when the persona or a prompt needs a pronoun for the user.
user_pronoun = "he"
user_possessive = "his"

[client]
# The key to hold to talk, named the way the browser names it
# (KeyboardEvent.code): ControlRight, AltLeft, Space, F13, KeyT...
#
# This is the canonical spelling because it is the one with a specification
# behind it; the Python client maps it to pynput's names. Pick it in the
# panel under Settings rather than by guessing at the name here.
push_to_talk_key = "ControlRight"
# Whether the panel may use the microphone as soon as it is open. With this
# on, the browser holds the mic stream for as long as the tab is, which is
# what the recording indicator in the tab strip is showing.
listen_when_open = true
# Whether the panel offers Naka her tools — timers, notes, the clock, GPU
# status. Costs roughly 600ms per reply, because she must finish deciding
# whether to call one before anything can be spoken. Off is faster and can
# only talk; the Python client's --no-tools is the same switch.
use_tools = true

[server]
host = "127.0.0.1"
port = 8000

[llm]
# llama.cpp container from compose.yml
url = "http://localhost:8080"
temperature = 0.0
max_tokens = 256
# Both Gemma 4 and Qwen3 emit reasoning tokens by default. They never reach the
# speakers, so they are pure latency: with a 256-token cap neither model
# produced a single spoken word. See eval/RESULTS.md.
enable_thinking = false
# The system prompt now comes from config/persona.md plus memory.

[stt]
model = "large-v3-turbo"
compute_type = "int8_float16"
# Forced rather than auto-detected: detection degrades mixed FR/EN utterances.
language = "en"
beam_size = 5

[tts]
voice = "af_heart"
lang_code = "a"
sample_rate = 24000

[audio]
# Opus is defined at 48 kHz; TTS output is resampled up to it.
opus_sample_rate = 48000
bitrate = 24000

[ops]
# Minutes without a request before the GPU is released automatically. Short is
# fine: reloading costs about 8s, and the client starts the reload the moment
# you press the talk key, so most of that is absorbed while you are speaking.
# 0 disables idle unloading.
idle_unload_minutes = 1
# Whether idle unloading also stops the llama.cpp container. It holds 7.4 GB of
# the 9.3 GB, so leaving it running defeats most of the point.
idle_unload_llm = true

[logs]
# Days of history to keep. Applies to naka.log, turns.jsonl and audit.jsonl
# alike; anything older is dropped hourly. 0 keeps everything forever.
#
# Note that audit.jsonl is the record of every tool call made on this machine,
# so shortening this shortens how far back that can be checked.
retention_days = 14
