# The allowlist. A tool that is not named here cannot be called, whatever the
# model asks for — registration in code is not enough.
#
# Most tools are narrow on purpose: notes confined to notes_dir, timers, the
# clock. Two reach further, and both sit behind a switch in settings.toml's
# [powers] that is off until the person turns it on:
#
#   web    search and read pages. Whatever comes back is marked untrusted,
#          because a page can be written to give her instructions.
#   shell  PowerShell, as the person. A quantised model hallucinating a
#          destructive command from an ambiguous sentence is a realistic
#          scenario, so only commands PowerShell's own parser shows to be
#          read-only run unasked; everything else waits for a spoken yes, and
#          so does every command once web content has entered the turn.
#
# A person's copy of this file is laid over the shipped one tool by tool, so a
# tool added in a later version shows up without their copy being rewritten.

agent:
  # Hard ceiling on tool calls per request. The loop stops here whether or not
  # the model thinks it is finished.
  max_steps: 5
  # Wall-clock ceiling for the whole loop, seconds.
  timeout: 30
  # Tools are only offered when the request asks for them (agentic: true).
  default_agentic: false
  # The ceilings while web or shell is switched on. Looking something up and
  # reading what comes back is two steps before an answer even starts, and a
  # task at the prompt is a chain of small checked commands — neither fits in
  # five steps or thirty seconds.
  deep:
    max_steps: 12
    timeout: 180

paths:
  # The only directory any tool may read or write.
  notes_dir: "~/Documents/Naka Notes"

facts:
  # Hard ceiling on remembered facts. They sit in the system prompt on every
  # single turn, so this is a running cost, not storage. At the cap she must
  # forget something before she can remember anything new — which forces the
  # list to stay curated rather than becoming a diary.
  max: 25
  # Longest a single fact may be. A fact that needs more than this is a story,
  # and stories belong in notes.
  max_chars: 120

tools:
  get_time:
    enabled: true
    destructive: false

  gpu_status:
    enabled: true
    destructive: false

  set_timer:
    enabled: true
    destructive: false

  list_timers:
    enabled: true
    destructive: false

  cancel_timer:
    enabled: true
    # Cancelling a timer loses whatever it was for, and the user cannot get it
    # back by waiting.
    destructive: true

  search_notes:
    enabled: true
    destructive: false

  read_note:
    enabled: true
    destructive: false

  write_note:
    enabled: true
    destructive: false

  delete_note:
    enabled: true
    destructive: true

  # Memory is maintained by the reconciler after each turn, not by the model
  # calling a tool mid-conversation. It would say "I'll hang onto that" or
  # "done, cleared it" and call nothing, leaving the claim false. Left
  # registered but disabled so the history of why is visible.
  remember:
    enabled: false
    destructive: false

  forget_fact:
    enabled: false
    destructive: false

  # --- powers: offered only while their switch in settings.toml is on ------

  web_search:
    enabled: true
    destructive: false

  fetch_page:
    enabled: true
    destructive: false

  run_command:
    enabled: true
    # Not blanket-destructive: the tool decides per command whether to ask,
    # from what PowerShell's parser finds in it. See server/tools/shell.py.
    destructive: false
