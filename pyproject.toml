[project]
name = "naka"
version = "0.1.0"
description = "Naka — assistante vocale 100% locale"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    # Kokoro's G2P needs this spacy model and will silently download it at
    # runtime if absent — a network call the project does not allow.
    "en-core-web-sm",
    "python-multipart>=0.0.32",
    "torch",
    "torchaudio",
    "uvicorn>=0.53.0",
    "tomlkit>=0.15.1",
    "ddgs>=9.16.0",
    "trafilatura>=2.2.0",
    "httpx>=0.28.1",
]

[tool.uv]
# Hold the cu128 build regardless of what any dependency asks for: ML packages
# routinely pin an exact torch (chatterbox-tts wanted 2.6.0), and versions
# before cu128 ship no sm_120 kernels, which breaks this Blackwell card in a
# way that only shows up at the first CUDA op.
override-dependencies = ["torch==2.11.0", "torchaudio==2.11.0"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
# Everything the tray imports, listed even where the runtime already pulls it
# in: the frozen build installs this group on its own.
tray = [
    "httpx>=0.28.1",
    "numpy",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "sounddevice>=0.5.6",
    "tomlkit>=0.15.1",
]
# Freezes the tray into Naka.exe: packaging/build.py installs this group and
# the tray's, alone, into a venv of its own. Never the runtime's — torch
# would be swept into the bundle.
build = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]
